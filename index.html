<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kuuhaku 7.0</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#070614">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Chakra+Petch:wght@400;600&display=swap">
<style>
:root{--bg:#070614;--panel:#120d2b;--line:#2a2063;--cy:#19e3ff;--mg:#ff2e93;--gd:#ffd23f;--tx:#eef0ff;--mut:#8f8bc4;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html,body{background:var(--bg);color:var(--tx);font-family:'Chakra Petch',system-ui,sans-serif;min-height:100%}
body{overflow-x:hidden}
.grid{position:fixed;left:-50%;right:-50%;bottom:0;height:50vh;background:linear-gradient(transparent,rgba(25,227,255,.16)),repeating-linear-gradient(90deg,rgba(25,227,255,.3) 0 1px,transparent 1px 60px),repeating-linear-gradient(0deg,rgba(255,46,147,.26) 0 1px,transparent 1px 60px);transform:perspective(380px) rotateX(62deg);transform-origin:bottom;animation:go 4s linear infinite;z-index:0}
@keyframes go{to{background-position:0 0,0 0,0 60px}}
.glow{position:fixed;inset:0;background:radial-gradient(60% 40% at 50% 0,rgba(255,46,147,.26),transparent),radial-gradient(50% 35% at 100% 30%,rgba(25,227,255,.16),transparent);z-index:0}
main{position:relative;z-index:1;max-width:600px;margin:0 auto;padding:16px 14px 104px}
.top{display:flex;justify-content:space-between;align-items:center;font-family:Orbitron;font-weight:900;letter-spacing:.12em;font-size:15px}
.top b{color:var(--cy)}.top i{font-style:normal;color:var(--mut);font-size:11px;border:1px solid var(--line);padding:3px 8px;border-radius:99px}
.card{background:linear-gradient(160deg,rgba(18,13,43,.93),rgba(30,16,60,.9));border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:14px;box-shadow:0 10px 36px rgba(0,0,0,.5)}
.hero{display:flex;gap:14px;align-items:center;border-color:rgba(25,227,255,.5);box-shadow:0 0 28px rgba(25,227,255,.22)}
.av{width:84px;height:84px;flex:none;border-radius:14px;background:#0a0720;border:2px solid var(--cy);overflow:hidden;box-shadow:0 0 16px rgba(25,227,255,.4)}
.av svg{width:100%;height:100%;display:block;image-rendering:pixelated}
.who{flex:1;min-width:0}
.name{font-family:Orbitron;font-weight:700;font-size:19px;background:none;border:0;border-bottom:1px dashed var(--mut);color:var(--tx);width:100%;padding:2px 0;outline:none}
.name:focus{border-bottom-color:var(--cy)}
.ttl{color:var(--mg);font-size:13px;margin-top:6px;font-weight:600}
.lv{display:flex;align-items:baseline;gap:8px}
.lv strong{font-family:Orbitron;font-size:30px;font-weight:900;color:var(--gd);text-shadow:0 0 16px rgba(255,210,63,.6)}
.lv small{color:var(--mut);font-size:13px}
.bar{height:11px;border-radius:99px;background:#0a0720;border:1px solid var(--line);overflow:hidden;margin-top:6px}
.bar>div{height:100%;width:0;background:linear-gradient(90deg,var(--mg),var(--cy));box-shadow:0 0 12px var(--cy);transition:width .5s}
.row{display:flex;justify-content:space-between;font-size:12px;color:var(--mut);margin-top:5px}
.wallet{display:flex;align-items:center;gap:12px}
.coin{width:48px;height:48px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:Orbitron;font-weight:900;font-size:24px;color:#3a2600;background:radial-gradient(circle at 30% 30%,#fff3b0,var(--gd) 55%,#c98a00);box-shadow:0 0 20px rgba(255,210,63,.55)}
.bal{font-family:Orbitron;font-weight:900;font-size:28px;color:var(--gd)}.bal small{font-size:13px;margin-left:6px;color:var(--mut)}
h2{font-family:Orbitron;font-size:14px;letter-spacing:.06em;margin-bottom:10px;color:var(--cy)}
p.sub{color:var(--mut);font-size:13px;margin-bottom:10px}
.btn{font-family:Orbitron;font-weight:700;font-size:12px;color:#1a0b00;background:linear-gradient(135deg,var(--gd),#ff9d2e);border:0;border-radius:10px;padding:10px 14px;cursor:pointer}
.btn.alt{background:linear-gradient(135deg,var(--cy),#7a5cff);color:#05031a}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--mut)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.tile{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px 4px;text-align:center;color:var(--tx);font:inherit;font-size:13px;cursor:pointer}
.tile span{display:block;font-size:26px;margin-bottom:2px}
.tile.lock{opacity:.5}.tile small{display:block;color:var(--mut);font-size:11px}
.tile:hover,.tile:focus-visible{border-color:var(--mg);outline:none}
.m{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.m:first-of-type{border-top:0}.m .c{flex:1}.m em{font-style:normal;font-family:Orbitron;font-size:11px;color:var(--gd);text-align:right}
.m.ok .c{opacity:.5;text-decoration:line-through}
.inp{width:100%;background:#0a0720;border:1px solid var(--line);border-radius:10px;color:var(--tx);font:inherit;padding:10px;outline:none;resize:vertical}
.inp:focus{border-color:var(--cy)}
.tools{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.post{border-top:1px solid var(--line);padding:12px 0}.post:first-child{border-top:0}
.post .h{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}.post .h b{color:var(--cy);font-size:14px}
.post p{margin-top:6px;white-space:pre-wrap;word-break:break-word;font-size:15px}
.post img{max-width:100%;border-radius:10px;margin-top:8px;border:1px solid var(--line)}
.post h3{font-family:Orbitron;font-size:15px;margin-top:6px;color:var(--gd)}
.x{background:none;border:0;color:var(--mut);cursor:pointer;font-size:12px}
.chat{height:46vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;padding:4px 2px}
.msg{max-width:84%;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:7px 10px;font-size:14px;word-break:break-word}
.msg b{display:block;font-size:11px;color:var(--cy)}.msg.me{align-self:flex-end;border-color:var(--mg)}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.it{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.it.eq{border-color:var(--cy);box-shadow:0 0 14px rgba(25,227,255,.35)}
.it .av{width:72px;height:72px;margin:0 auto 6px;border-width:1px}
.it b{display:block;font-size:14px}.it small{color:var(--gd);font-family:Orbitron;font-size:11px;display:block;margin:4px 0 8px}
.books{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bk{aspect-ratio:2/3;border-radius:8px;border:1px solid var(--line);background:linear-gradient(160deg,#2a1260,#0d0a26);display:grid;place-items:center;text-align:center;padding:8px;font-size:12px;color:var(--mut)}
.bk b{font-family:Orbitron;color:var(--tx);display:block;margin-bottom:4px}
.lockbox{text-align:center;padding:30px 10px}.lockbox div{font-size:44px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;gap:2px;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(7,6,20,.92);backdrop-filter:blur(10px);border-top:1px solid var(--line);overflow-x:auto}
nav button{flex:1 0 62px;background:none;border:0;color:var(--mut);font:inherit;font-size:11px;cursor:pointer;padding:3px}
nav button span{display:block;font-size:21px}nav button.on{color:var(--cy)}nav button.lk{opacity:.4}
.fx{position:fixed;z-index:20;pointer-events:none;font-family:Orbitron;font-weight:900;color:var(--cy);text-shadow:0 0 10px var(--cy);animation:up 1s forwards}
@keyframes up{to{transform:translateY(-60px);opacity:0}}
.lvl{position:fixed;inset:0;z-index:30;display:none;place-items:center;background:rgba(7,6,20,.9);text-align:center;padding:20px}.lvl.show{display:grid}
.lvl h3{font-family:Orbitron;font-weight:900;font-size:clamp(32px,10vw,54px);color:var(--gd);text-shadow:0 0 30px var(--mg)}
.lvl p{margin:12px 0 20px}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--cy);padding:9px 14px;border-radius:12px;z-index:25;font-size:14px;display:none;max-width:90%;text-align:center}
@media (prefers-reduced-motion:reduce){.grid{animation:none}}

.trow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:6px}.trow .ttl{margin-top:0}
.qbtn{background:rgba(255,46,147,.15);border:1px solid var(--mg);color:var(--tx);font:inherit;font-size:12px;font-weight:600;border-radius:99px;padding:5px 10px;cursor:pointer;white-space:nowrap}
.poor{filter:grayscale(.6);opacity:.7}.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cd{position:relative;background:var(--panel);border:2px solid var(--line);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;cursor:pointer}
.cd .e{font-size:30px}.cd b{display:block;font-size:12px}.cd small{display:block;color:var(--mut);font-size:11px}
.cd.sel{box-shadow:0 0 14px var(--cy);outline:2px solid var(--cy)}.cd.used{opacity:.3;pointer-events:none}.cd.hid{border-style:dashed}
.cd.empty{border-style:dashed;color:var(--mut);display:grid;place-items:center;min-height:96px}
.cnt{position:absolute;top:2px;right:5px;font-family:Orbitron;font-size:10px;color:var(--gd)}

.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;display:flex;gap:6px;padding:10px 0 8px;background:linear-gradient(var(--bg) 75%,transparent)}
.pill{display:flex;align-items:center;gap:7px;background:rgba(10,7,32,.92);border:1px solid var(--line);border-radius:12px;padding:4px 8px;height:40px;font-family:Orbitron;font-weight:700}
.xpp{flex:1.5;min-width:0}.exp{flex:1.1;min-width:0}.tmp{font-size:11px;color:var(--cy);flex:none}
.lvbadge{width:30px;height:30px;flex:none;display:grid;place-items:center;font-weight:900;font-size:14px;color:#1a0b00;background:linear-gradient(135deg,var(--gd),#ff9d2e);clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%)}
.xbar{position:relative;flex:1;height:20px;border-radius:99px;background:#0a0720;border:1px solid var(--line);overflow:hidden}
.xbar div{height:100%;background:linear-gradient(90deg,var(--mg),var(--cy));box-shadow:0 0 10px var(--cy);transition:width .5s}
.xbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;text-shadow:0 1px 2px #000}
.coin.sm{width:24px;height:24px;font-size:13px;box-shadow:0 0 10px rgba(255,210,63,.5)}
.exp b{color:var(--gd);font-size:14px;overflow:hidden;text-overflow:ellipsis}
.plus{margin-left:auto;width:24px;height:24px;flex:none;border-radius:50%;border:0;background:linear-gradient(135deg,#5dff7a,#19b34a);color:#04200c;font-weight:900;cursor:pointer}
.banner{display:flex;align-items:center;gap:10px;margin-top:4px;padding:10px;border-radius:14px;background:linear-gradient(90deg,rgba(255,46,147,.35),rgba(25,227,255,.12));border:1px solid var(--mg);box-shadow:0 0 20px rgba(255,46,147,.25)}
.av.sm{width:56px;height:56px;border-radius:10px}
.sq{position:relative;width:44px;height:44px;flex:none;border-radius:10px;background:var(--panel);border:1px solid var(--cy);font-size:20px;cursor:pointer;color:var(--tx)}
.bd{position:absolute;top:-7px;right:-7px;background:var(--mg);color:#fff;border-radius:99px;min-width:18px;height:18px;padding:0 4px;font:700 11px Orbitron;display:grid;place-items:center;font-style:normal}
.stage{display:grid;grid-template-columns:68px 1fr 68px;gap:6px;align-items:start;margin-top:14px}
.col{display:flex;flex-direction:column;gap:14px}
.rc{background:none;border:0;color:var(--tx);font:inherit;font-size:11px;text-align:center;cursor:pointer}
.rc .ci{width:58px;height:58px;border-radius:50%;margin:0 auto 3px;display:grid;place-items:center;font-size:25px;background:radial-gradient(circle,#2a1a6a,#0d0a26);border:3px solid var(--gd);box-shadow:0 0 14px rgba(255,210,63,.35)}
.rc.lock{opacity:.55}.rc.lock .ci{border-color:var(--line);box-shadow:none}
.plat{position:relative;display:grid;place-items:center;min-height:260px}
.plat::before{content:"";position:absolute;width:min(230px,100%);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(25,227,255,.4),transparent 65%);border:2px solid rgba(25,227,255,.45);box-shadow:0 0 40px rgba(25,227,255,.4),inset 0 0 30px rgba(255,46,147,.3)}
.plat .av{position:relative;width:min(170px,90%);height:auto;aspect-ratio:1;border-radius:18px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-8px)}}
.ev{margin-top:14px;border:2px solid var(--mg);border-radius:14px;overflow:hidden;cursor:pointer;background:var(--panel)}
.ev header{background:linear-gradient(90deg,#6a2cff,var(--mg));text-align:center;font-family:Orbitron;font-weight:700;font-size:13px;padding:5px}
.ev>div{padding:10px;font-size:14px}
.cta{display:block;width:100%;margin-top:14px;padding:14px;border-radius:14px;border:0;font-family:Orbitron;font-weight:900;font-size:26px;color:#2a1500;background:linear-gradient(#ffe36a,#ff9d2e);box-shadow:0 5px 0 #b86a00,0 0 24px rgba(255,210,63,.45);cursor:pointer}
.cta small{display:block;font:600 12px 'Chakra Petch',sans-serif;margin-top:2px}.cta.lk{filter:grayscale(.7);opacity:.7}
.mascot{position:relative;width:min(180px,92%);animation:fl 3s ease-in-out infinite;text-align:center}.mascot svg{width:100%;display:block;filter:drop-shadow(0 0 14px rgba(25,227,255,.6))}.mascot svg[viewBox="0 0 8 8"]{image-rendering:pixelated}.mascot small{display:block;margin-top:6px;color:var(--cy);font-family:Orbitron;font-size:11px}
@media (prefers-reduced-motion:reduce){.plat .av,.mascot{animation:none}}
.av img{width:100%;height:100%;object-fit:cover;display:block}

.post .h{align-items:flex-start;gap:8px}.tm{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.x.del{color:var(--mg);white-space:nowrap}.x.arm{color:#fff;background:var(--mg);border-radius:6px;padding:2px 8px}
.pv{margin-top:8px}.pv img{max-width:150px;border-radius:10px;border:1px solid var(--line);display:block}.pv .x{margin-top:4px}
.acts{display:flex;gap:10px;margin-top:10px}
.like{background:none;border:1px solid var(--line);color:var(--mut);border-radius:99px;padding:5px 14px;font:inherit;font-size:14px;cursor:pointer}
.like.on{color:var(--mg);border-color:var(--mg);background:rgba(255,46,147,.12)}
.fbtn{position:relative;display:inline-block;overflow:hidden;cursor:pointer}.fbtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.atitle{font-family:Orbitron;font-size:18px;color:var(--gd);margin:6px 0 2px}.par{margin-top:10px;line-height:1.6;font-size:15px;white-space:pre-wrap}
.sub2{font-family:Orbitron;color:var(--cy);font-size:15px;margin-top:18px}.acard{cursor:pointer;border-top:1px solid var(--line);padding:12px 0}.acard:first-of-type{border-top:0}
.cover{width:100%;border-radius:10px;margin-top:10px;border:1px solid var(--line);display:block}
</style>
</head>
<body>
<div class="glow"></div><div class="grid"></div>
<main><div class="top"><div>KUU<b>HAKU</b></div><i id="net">v2.0</i></div><div id="hud" class="hud"></div><div id="view"></div></main>
<nav id="nav"></nav>
<div class="toast" id="toast"></div>
<div class="lvl" id="lvlbox"><div><h3 id="lt"></h3><p id="ls"></p><button class="btn" id="lok">Continuar</button></div></div>

<script>
(async function(){
var $=function(i){return document.getElementById(i)};
function h(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
var db=null,uid='local',pdoc=null;
try{if(window.claude){var u=await claude.use('user');if(u)uid=await u.id();db=await claude.use('db')}}catch(e){}
if(db)pdoc=db.collection('data/users/'+uid).doc('profile');
$('net').textContent=db?'v7.0 online':'v7.0 offline';

var TABS=[['home','🏠','Home',1],['quests','🎯','Quests',1],['laika','💬','Laika',2],['loja','🛒','Loja',2],['bib','📚','Biblioteca',3],['grim','📜','Grimório',4],['chat','🌐','Chat',5],['cards','🃏','Card Game',7]];
var TITLES=[[1,'Novato'],[3,'Explorador'],[5,'Caçador'],[8,'Veterano'],[12,'Mestre'],[20,'Lenda']];
function title(l){var t='Novato';TITLES.forEach(function(x){if(l>=x[0])t=x[1]});return t}
function need(l){return 100*l}

var ITEMS=[['a3','Fantasminha',0],['a6','Mak',100]];
function known(i){return ITEMS.some(function(x){return x[0]===i})}
function avatar(id){if(IMGS[id])return '<img src="'+IMGS[id]+'" alt="Avatar">';var p=PAL[id]||PAL.a3,m=MAP[id]||MAP.a3,s='<svg viewBox="0 0 8 8" shape-rendering="crispEdges">';
 m.forEach(function(r,y){for(var x=0;x<8;x++){var c=p[r[x]];if(c)s+='<rect x="'+x+'" y="'+y+'" width="1" height="1" fill="'+c+'"/>'}});return s+'</svg>'}
function avBox(id,cls){var d=h('div',cls||'av');d.innerHTML=avatar(id);return d}

var today=new Date().toDateString();
var P={cards:{},deck:[],starter:0,name:'Jogador 1',xp:0,level:1,exis:0,avatar:'a3',owned:['a3'],q:{day:today,done:{}}};
try{if(pdoc){var s=await pdoc.get();if(s.exists)P=Object.assign(P,s.data())}else{var r=localStorage.getItem('kuuhaku2');if(r)P=Object.assign(P,JSON.parse(r))}}catch(e){}
if(!P.q||P.q.day!==today)P.q={day:today,done:{}};
if(!known(P.avatar))P.avatar='a3';P.owned=(P.owned||[]).filter(known);if(P.owned.indexOf('a3')<0)P.owned.push('a3');
var sec=0,view='home',saveT;
function save(){clearTimeout(saveT);saveT=setTimeout(function(){try{if(pdoc)pdoc.set(P);else localStorage.setItem('kuuhaku2',JSON.stringify(P))}catch(e){}},1200)}
function toast(t){var e=$('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(function(){e.style.display='none'},2400)}
function fx(t,x,y){var d=h('div','fx',t);d.style.left=x+'px';d.style.top=y+'px';document.body.appendChild(d);setTimeout(function(){d.remove()},1000)}
function unlocked(t){return P.level>=t[3]}
function addXp(n,x,y){
  P.xp+=n;fx('+'+n+' XP',x||innerWidth/2,y||150);
  while(P.xp>=need(P.level)){
    P.xp-=need(P.level);P.level++;var b=P.level*50;P.exis+=b;
    var un=TABS.filter(function(t){return t[3]===P.level}).map(function(t){return t[2]});
    $('lt').textContent='NÍVEL '+P.level+' · '+title(P.level);
    $('ls').textContent='+'+b+' exis'+(un.length?' · Nova aba: '+un.join(', '):'');
    $('lvlbox').classList.add('show');
  }
  save();draw(true);
}

    var mg=h('div','cgrid');B.mine.forEach(function(id,i){var d=cardEl(id);if(B.used.indexOf(i)>-1)d.classList.add('used');d.onclick=function(){play(i)};mg.appendChild(d)});b.appendChild(mg);
    B.log.forEach(function(l){var p=h('p','sub',l);p.style.marginTop='6px';b.appendChild(p)});
    if(B.done){var rs=h('h2','',B.win?'🏆 Vitória! +40 XP e +30 exis':'Fim da batalha. +10 XP');rs.style.marginTop='12px';b.appendChild(rs);var bb=h('button','btn','Voltar');bb.onclick=function(){B=null;draw()};b.appendChild(bb)}
    V.appendChild(b);return}
  var c=h('section','card');c.appendChild(h('h2','','Card Game'));
  c.appendChild(h('p','sub','Compre pacotes na Loja, monte um deck de 3 cartas e desafie bots ou outros membros. 🔥 vence 🌿, 🌿 vence 💧 e 💧 vence 🔥 (+3 de poder).'));V.appendChild(c);
  var dk=h('section','card');dk.appendChild(h('h2','','Seu deck ('+P.deck.length+'/3)'));var dg=h('div','cgrid');
  for(var i=0;i<3;i++){var id=P.deck[i];if(id&&card(id)&&P.cards[id])dg.appendChild(cardEl(id));else{var e=h('div','cd empty','vazio');dg.appendChild(e)}}
  dk.appendChild(dg);
  function ready(){P.deck=P.deck.filter(function(i){return P.cards[i]>0&&card(i)});if(P.deck.length!==3){toast('Monte um deck com 3 cartas');return false}return true}
  var tl=h('div','tools'),bot=h('button','btn','⚔️ Lutar contra bot');bot.onclick=function(){if(!ready())return;startBattle([0,0,0].map(drawCard),'Bot')};
  var pub=h('button','btn alt','Publicar deck');pub.onclick=function(){if(!ready())return;if(!db){toast('Disponível só online');return}db.collection('decks').doc(uid).set({name:P.name,deck:P.deck,ts:Date.now()}).then(function(){toast('Deck publicado: outros membros podem te desafiar')}).catch(function(){toast('Não consegui publicar')})};
  tl.appendChild(bot);tl.appendChild(pub);dk.appendChild(tl);V.appendChild(dk);
  var ids=Object.keys(P.cards).filter(function(k){return P.cards[k]>0&&card(k)});
  var co=h('section','card');co.appendChild(h('h2','','Coleção ('+ids.length+'/'+CARDS.length+')'));
  if(!ids.length)co.appendChild(h('p','sub','Nenhuma carta ainda. Compre pacotes na Loja.'));
  var cg=h('div','cgrid');ids.forEach(function(id){var d=cardEl(id,P.cards[id]),inn=P.deck.indexOf(id)>-1;if(inn)d.classList.add('sel');
    d.onclick=function(){if(inn)P.deck.splice(P.deck.indexOf(id),1);else if(P.deck.length<3)P.deck.push(id);else{toast('Deck cheio: toque numa carta do deck para tirar');return}save();draw(true)};cg.appendChild(d)});
  co.appendChild(cg);V.appendChild(co);
  var op=h('section','card');op.appendChild(h('h2','','Desafiar membros'));
  if(!ghosts||!ghosts.length)op.appendChild(h('p','sub','Nenhum deck de outro membro publicado ainda.'));
  (ghosts||[]).forEach(function(g){var m=h('div','m');m.appendChild(h('div','c',g.name||'Anônimo'));var bt=h('button','btn','Desafiar');bt.onclick=function(){if(!ready())return;startBattle(g.deck,g.name||'Membro')};m.appendChild(bt);op.appendChild(m)});
  V.appendChild(op)}
var VIEWS={home:vHome,quests:vQuests,laika:vLaika,loja:vShop,bib:vBib,grim:vGrim,chat:vChat,cards:vCards};
function draw(soft){
  var t=TABS.filter(function(x){return x[0]===view})[0];
  if(soft&&view!=='home'&&document.activeElement&&/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  drawHud();V.innerHTML='';if(!unlocked(t))lockView(t);else VIEWS[view]();
  var n=$('nav');n.innerHTML='';TABS.filter(function(x){return x[0]!=='quests'}).forEach(function(x){var b=h('button',(x[0]===view?'on ':'')+(unlocked(x)?'':'lk'));b.appendChild(h('span','',x[1]));b.appendChild(document.createTextNode(x[2]));b.onclick=function(e){go(x[0],e)};n.appendChild(b)});
}
function go(v,e){view=v;if(e)addXp(1,e.clientX,e.clientY);draw();scrollTo(0,0)}
reward('open',10,10);
setInterval(function(){sec++;if(sec===300)reward('stay',30,25);if(sec%60===0)addXp(5)},1000);
draw();
})();
</script>
